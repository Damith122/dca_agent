name: Trend funding AI v2 research
on:
  push:
    branches: [research/ai-funding-crowding-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      API_KEY: ""
      API_SECRET: ""
      DRY_RUN: "true"
      LIVE_TRADING_CONFIRMATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run AI-assisted research backtest
        shell: bash
        run: |
          set +e
          python -u backtest_trend_funding_ai_v2.py 2>&1 | tee TREND_FUNDING_AI_V2.log
          code=${PIPESTATUS[0]}
          echo "$code" > TREND_FUNDING_AI_V2.exit_code.txt
          exit 0
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: trend-funding-ai-v2
          path: |
            TREND_FUNDING_AI_V2_SUMMARY.json
            TREND_FUNDING_AI_V2.log
            TREND_FUNDING_AI_V2.exit_code.txt
          if-no-files-found: warn
