name: Offline risk validation
on:
  pull_request:
  push:
    branches: [main, codex/risk-admission-paper-validation]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      GITHUB_TOKEN: ""
      DRY_RUN: "true"
      LIVE_TRADING_CONFIRMATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Admission policy and mocked execution
        run: |
          python -m unittest -v test_exposure_guard.py test_admission_integration.py test_paper_launcher.py
          python -m compileall -q config.py dca2.py exchange.py trading.py exposure_guard.py audit_trade_evidence.py paper_summary.py
      - name: Simulated fill and accounting regressions
        env:
          EXPOSURE_GUARD_ENABLED: "false"
        run: python test_dry_fills.py

  btc-regime-breadth-research:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[run-btc-regime-breadth]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      GITHUB_TOKEN: ""
      DRY_RUN: "true"
      LIVE_TRADING_CONFIRMATION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Frozen BTC regime plus breadth backtest
        shell: bash
        run: |
          set +e
          python -u backtest_tsmom_regime_breadth.py --months 48 --starting-equity 15 --json BTC_REGIME_BREADTH_20260904_validation_summary.json 2>&1 | tee BTC_REGIME_BREADTH_20260904.log
          code=${PIPESTATUS[0]}
          echo "$code" > BTC_REGIME_BREADTH_20260904.exit_code.txt
          exit 0
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: btc-regime-breadth-20260904
          path: |
            BTC_REGIME_BREADTH_20260904_validation_summary.json
            BTC_REGIME_BREADTH_20260904.log
            BTC_REGIME_BREADTH_20260904.exit_code.txt
          if-no-files-found: warn
